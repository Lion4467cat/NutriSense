<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1780" viewBox="0 0 1800 1780">
  <defs>
    <marker id="arrow" markerWidth="20" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L18,9 L0,18 Z" fill="#344256"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #182536; text-anchor: middle; }
      .title { font-size: 38px; font-weight: 700; fill: #24364b; }
      .section { font-size: 24px; font-weight: 700; fill: #53657a; letter-spacing: 1px; }
      .label { font-size: 27px; font-weight: 700; }
      .detail { font-size: 21px; }
      .edge-label { font-size: 19px; font-weight: 600; fill: #344256; }
      .box { rx: 18; ry: 18; stroke-width: 3; }
      .stage { fill: #eef4fb; stroke: #3c5874; }
      .success { fill: #e8f5ec; stroke: #32804d; }
      .warning { fill: #fff6df; stroke: #b17a12; }
      .failure { fill: #faeaea; stroke: #ae4545; }
      .neutral { fill: #f1f3f6; stroke: #687b90; }
      .wire { fill: #e9edf5; stroke: #455b78; }
      .edge { fill: none; stroke: #344256; stroke-width: 4; marker-end: url(#arrow); }
      .soft-edge { fill: none; stroke: #687b90; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <text class="title" x="900" y="52">NutriSense meal analysis and advice flow</text>

  <rect class="box stage" x="180" y="95" width="1440" height="118"/>
  <text class="label" x="900" y="144">Meal photo and capture context</text>
  <text class="detail" x="900" y="181">class band, service day, camera metadata</text>

  <path class="edge" d="M900 213 V255"/>
  <rect class="box stage" x="180" y="255" width="1440" height="118"/>
  <text class="label" x="900" y="304">Input checks and scale anchor</text>
  <text class="detail" x="900" y="341">validated context; 60 mm ArUco measured scale or a disclosed prior</text>

  <path class="edge" d="M900 373 V415"/>
  <rect class="box stage" x="180" y="415" width="1440" height="132"/>
  <text class="label" x="900" y="465">SAM 2.1 food mask and SigLIP 2 class scores</text>
  <text class="detail" x="900" y="505">41 WED food classes; ranked evidence and configured serving/nutrient mapping</text>

  <path class="edge" d="M900 547 V589"/>
  <rect class="box stage" x="180" y="589" width="1440" height="132"/>
  <text class="label" x="900" y="639">Automatic meal structure detection</text>
  <text class="detail" x="900" y="679">3 x 3 grid prompts, up to 9 distinct regions; deduplicate, then partition overlap pixels once</text>

  <path class="edge" d="M900 721 V760"/>
  <text class="section" x="900" y="751">EVIDENCE AND ROUTING</text>

  <rect class="box success" x="35" y="785" width="410" height="165"/>
  <text class="label" x="240" y="830">Accepted and complete</text>
  <text class="detail" x="240" y="870">class and item regions</text>
  <text class="detail" x="240" y="903">can support a school score</text>

  <rect class="box warning" x="485" y="785" width="410" height="165"/>
  <text class="label" x="690" y="830">Uncertain but usable</text>
  <text class="detail" x="690" y="870">low class score, detector</text>
  <text class="detail" x="690" y="903">failure, or component mismatch</text>

  <rect class="box failure" x="935" y="785" width="410" height="165"/>
  <text class="label" x="1140" y="830">Required stage fails</text>
  <text class="detail" x="1140" y="870">no usable candidate,</text>
  <text class="detail" x="1140" y="903">portion, or nutrient estimate</text>

  <rect class="box neutral" x="1385" y="785" width="380" height="165"/>
  <text class="label" x="1575" y="830">Unsupported food</text>
  <text class="detail" x="1575" y="870">outside configured</text>
  <text class="detail" x="1575" y="903">school policy scope</text>

  <path class="edge" d="M240 950 V1010"/>
  <path class="edge" d="M690 950 V1010"/>
  <path class="edge" d="M1140 950 V1010"/>
  <path class="edge" d="M1575 950 V1010"/>

  <rect class="box success" x="35" y="1010" width="410" height="192"/>
  <text class="label" x="240" y="1055">Per-region portions</text>
  <text class="detail" x="240" y="1096">measured-card geometry,</text>
  <text class="detail" x="240" y="1128">WED mass head, or</text>
  <text class="detail" x="240" y="1160">flagged size prior</text>

  <rect class="box warning" x="485" y="1010" width="410" height="192"/>
  <text class="label" x="690" y="1055">Whole-mask estimate</text>
  <text class="detail" x="690" y="1096">top food mask and leading</text>
  <text class="detail" x="690" y="1128">meal label; tentative totals</text>
  <text class="detail" x="690" y="1160">no compliance verdict</text>

  <rect class="box failure" x="935" y="1010" width="410" height="192"/>
  <text class="label" x="1140" y="1055">cannot_verify</text>
  <text class="detail" x="1140" y="1096">withhold totals if required</text>
  <text class="detail" x="1140" y="1128">portion or nutrient stage</text>
  <text class="detail" x="1140" y="1160">cannot produce a value</text>

  <rect class="box neutral" x="1385" y="1010" width="380" height="192"/>
  <text class="label" x="1575" y="1055">out_of_scope</text>
  <text class="detail" x="1575" y="1096">no school assessment</text>
  <text class="detail" x="1575" y="1128">for unsupported labels</text>

  <path class="edge" d="M240 1202 V1260"/>
  <path class="edge" d="M690 1202 V1260"/>
  <rect class="box stage" x="35" y="1260" width="410" height="135"/>
  <text class="label" x="240" y="1312">Nutrient sampling</text>
  <text class="detail" x="240" y="1353">Monte Carlo, 4,000 samples</text>
  <rect class="box warning" x="485" y="1260" width="410" height="135"/>
  <text class="label" x="690" y="1312">ESTIMATED</text>
  <text class="detail" x="690" y="1353">totals shown; no school score</text>

  <path class="edge" d="M240 1395 V1445"/>
  <rect class="box stage" x="35" y="1445" width="410" height="135"/>
  <text class="label" x="240" y="1497">Coverage-aware policy</text>
  <text class="detail" x="240" y="1538">energy and protein thresholds</text>
  <rect class="box success" x="35" y="1600" width="410" height="100"/>
  <text class="label" x="240" y="1662">PASS / BORDERLINE / FAIL</text>
  <path class="edge" d="M240 1580 V1600"/>

  <rect class="box wire" x="485" y="1445" width="1280" height="135"/>
  <text class="label" x="1125" y="1497">Automatic critique and optional follow-up chat</text>
  <text class="detail" x="1125" y="1538">advisory only; successful turns are saved with the browser record</text>
  <path class="soft-edge" d="M690 1395 V1420 H1125 V1445"/>
  <path class="soft-edge" d="M445 1650 H465 V1565 H485"/>
</svg>
