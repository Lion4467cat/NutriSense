# NutriSense MDM compliance standards — central PM POSHAN bands plus the
# documented Karnataka state extension to classes IX-X. The IX-X kcal/protein
# values below are an application mapping, not a separately published
# statewide Karnataka nutrition minimum.
# This file is POLICY: compliance.py reads it, never re-derives it.

source:
  name: "PM POSHAN central norms and Karnataka Mid-Day Meal extension"
  central_guidelines: "https://pmposhan.education.gov.in/Files/Guidelines/2023/Guidelines%20on%20PM%20POSHAN%20SCHEME.pdf"
  karnataka_extension_evaluation: "https://fpibengaluru.karnataka.gov.in/storage/pdf-files/Technical%20Reports/FinalReport_PETS_08092022.pdf"
  karnataka_extension_administrative_report: "https://kla.kar.nic.in/council/house/Paperlaid/149/22.pdf"
  verified: 2026-10-27

# Energy/protein minima per student group (the two mandatory nutrients)
bands:
  "1-5":
    classes: "1-5"
    kcal: {direction: min, value: 450}
    protein_g: {direction: min, value: 12}
  "6-8":
    classes: "6-8"
    kcal: {direction: min, value: 700}
    protein_g: {direction: min, value: 20}
  "9-10":
    classes: "9-10"
    kcal: {direction: min, value: 700}
    protein_g: {direction: min, value: 20}
    inherited_from: "6-8"
    basis: "application mapping to central upper-primary reference; statewide IX-X kcal/protein norm not established by cited sources"

# Per-child/day RAW ingredient allocations — informational only. The 9-10 row
# follows NutriSense's upper-primary mapping and is not a statewide official
# IX-X ingredient schedule; Ballari's 2021-22 district report lists a different
# vegetable amount and does not specify kcal/protein minima.
# Never compare these grams directly against cooked plate weight (yield differs).
allocation_raw_per_day:
  "1-5":  {rice: 100, pulses: 20, vegetables: 50, oil: 5, salt: 2}
  "6-8":  {rice: 150, pulses: 30, vegetables: 75, oil: 7.5, salt: 4}
  "9-10": {rice: 150, pulses: 30, vegetables: 75, oil: 7.5, salt: 4}

# Ingredient rows: central norms for classes 1-8 and the documented Karnataka
# state extension for classes 9-10. Kept separate from energy/protein minima.
band_table:
  "1-5":  {rice: 100, dal: 20, vegetables: 50, oil: 5, salt: 2}
  "6-8":  {rice: 150, dal: 30, vegetables: 75, oil: 7.5, salt: 4}
  "9-10": {rice: 150, dal: 30, vegetables: 75, oil: 7.5, salt: 4}

# What the plate verdict is computed over
compliance:
  mandatory_nutrients: [kcal, protein_g]
  energy_basis: cooked_plate      # cooked plate kcal vs 450/700 minima
  thresholds: {pass_p: 0.9, fail_p: 0.1}
  coverage: {pass_min: 0.85, fail_min: 0.90}
  raw_gram_rows: informational    # surfaced as raw-equivalent diagnostic, never verdict input

advisory:
  sodium_salt:                    # advisory only — salt is NOT a verdict nutrient
    direction: max
    primary_g: 2
    upper_g: 4
    note: "informational; noted in report only"

out_of_scope:
  items: [vitamin_A_tablet, WIFS_tablet, albendazole, fuel, condiments]
  reason: "fuel & condiments excluded from energy accounting (cost lines only); tablets not food"

plate_sanity_g:                   # loose capture lint for cooked plate weight (±25%)
  "1-5": [300, 500]
  "6-8": [450, 750]
  "9-10": [450, 750]
