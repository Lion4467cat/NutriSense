# NutriSense dish menu — SINGLE source of dish truth (per plan v5).
# Never hardcode dish names in code; everything looks dishes up from here.
# Source: user-provided Karnataka PM POSHAN mid-day menu (transcribed 2026-10-08, verified exact).

dishes:
  rice_sambar:
    display_name: "Rice & Sambar"
    days: [mon, tue, wed, thu]
    aliases: [pepper_rasam_rice, tomato_rasam_rice]
    subtype: rice_sambar_mixed
    nutrition_source: official_menu
    standard_class: 1-5          # kcal target from standards.yaml band for the capture day
    components:
      rice:
        type: grain
        required: false          # component detection decides composition (mixed plate rule)
        generic_id: rice_boiled
        share: 0.6               # nominal recipe mass share (assumed; renderer GT = 0.6/0.4)
        density_g_ml: 0.75       # plated boiled rice bulk density (assumed)
      sambar:
        type: dal
        required: false
        generic_id: sambar
        composite_of: [dal, tamarind, vegetables, oil]
        share: 0.4               # nominal recipe mass share (assumed)
        density_g_ml: 1.03       # lentil stew ~ water density (assumed)

  vegetable_rice:
    display_name: "Vegetable Rice"
    days: []
    aliases: [veg_rice]
    subtype: vegetable_rice
    nutrition_source: generic     # no official recipe values available
    standard_class: 1-5
    components:
      vegetable_rice:
        type: grain
        required: true
        generic_id: vegetable_rice
        share: 1.0
        density_g_ml: 0.85        # spiced rice with veg/oil, plated (assumed)
    ranges_wider: true
    mandatory_report_line: "Nutrient values are generic estimates; an official recipe table was not available."

  bisibelebath:
    display_name: "Bisi Bele Bath"
    days: [fri]
    aliases: [bisi_bele_bath]
    subtype: bisibelebath
    nutrition_source: official_menu
    standard_class: 1-5
    components:
      bisibelebath:
        type: grain_pulse_mix
        required: true
        generic_id: bisibelebath
        share: 1.0
        density_g_ml: 0.90        # rice+pulses one-pot, plated (assumed)
    min_dev_plates: 2             # else falls back to synthetic-only validation (M7)

  wheat_product:
    display_name: "Wheat Product (Roti/Chapati)"
    days: [sat]
    aliases: [roti, chapati, pulka]
    nutrition_source: out_of_scope
    standard_class: 1-5
    status: out_of_scope
    doc_status: listed            # listed in the official menu document
    decision: dropped_by_user     # not implemented; kept only for menu completeness

# Daily vegetable lists (informational — used for component/alias matching context)
days:
  mon: {note: "leafy + tuber", vegetables: [palak, drumstick_leaves, leafy_mix, potato, brinjal, onion, tomato]}
  tue: {note: "gourd/brassica", vegetables: [white_pumpkin, carrot, beans, cabbage, beetroot, tomato]}
  wed: {note: "drumstick + tuber", vegetables: [drumstick, potato, onion, tomato]}
  thu: {note: "gourd/summer", vegetables: [pumpkin, bottle_gourd, cucumber, ladies_finger, radish, ridge_gourd]}
  fri: {note: "mixed + cereals", vegetables: [beans, turnip, carrot, capsicum, onion, tomato, cereals]}
  sat: {note: "greens + cereals", vegetables: [carrot, beans, cabbage, onion, dill_greens, cereals]}

# Global menu remarks (verbatim from doc)
remarks:
  - "Cereals and Millets to be used in rotation. Raghi, Jowar, Bajra shall be included at least twice a week."
  - "Pulses & Dhal shall be included at least 3 days a week."
  - "Weekly Menu should include variety of food and same food shall not be repeated."

# Non-dish items present on some days (recognition context only; not portion-scored)
generic_items: [curd, buttermilk, banana, egg, sambar, chutney, pickle]

# Capture metadata (per-plate, entered at capture time)
capture_fields:
  serving_style:
    type: enum
    values: [mixed, single]
    note: "mixed = multiple components blended in the vessel (e.g. sambar+rice stirred); single = components served separately"
  day: {type: enum, values: [mon, tue, wed, thu, fri, sat]}
  band: {type: enum, values: ["1-5", "6-8", "9-10"], note: "student class band of the capture"}
