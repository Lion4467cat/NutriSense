    "nodeenv==1.11.0",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.uv]
package = false
# Resolve only for the platform this lockfile serves (Linux CI + dev box).
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
moge = { git = "https://github.com/microsoft/MoGe.git", rev = "74fbce054ebed49800de42d0ad0e83495065719a" }
utils3d-moge = { git = "https://github.com/EasternJournalist/utils3d-moge.git", rev = "62f09d58509485564e24d5d9f6aac9ee9ebc0c37" }

# MoGe was installed --no-deps (its own pyproject drags gradio/pipeline/
# flex-gemm, none of which are installed). Supply the metadata that matches
# the ACTUAL installed state so the lockfile cannot pull them in.
[[tool.uv.dependency-metadata]]
name = "moge"
version = "3.0.0"
requires-dist = [
    "click>=8.3.1",
    "huggingface-hub",
    "matplotlib",
    "numpy>=2",
    "opencv-python-headless",
    "pillow",
    "scipy>=1.8",
    "starlette",
    "torch>=2.4",
    "torchvision>=0.19",
    "trimesh>=4.11",
    "tqdm",
    "utils3d-moge",
]
