# Project metadata for uv (STAGE 5). This is a VIRTUAL project (no build):
# it exists so `uv lock` can record the exact working environment — every
# dependency is pinned to the version verified installed in .venv on
# 2026-10-12. Do not run `uv sync` casually; it re-creates the venv from
# this file. Dev tools live in the dev dependency group.
